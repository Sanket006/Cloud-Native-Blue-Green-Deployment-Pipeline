# Kind cluster configuration for the Blue-Green Deployment demo.
#
# Creates a cluster named 'mycluster' with:
#   - 1 control-plane node
#   - 2 worker nodes  (mirrors the 2-node EKS setup in terraform/eks.tf)
#
# Usage:
#   kind create cluster --name mycluster --config k8s/kind-config.yaml
#
# The extraPortMappings block maps NodePort 30080 (defined in k8s/service.yaml)
# to port 30080 on your local machine, so you can open the app in your browser
# at http://localhost:30080 without needing kubectl port-forward.

apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster

nodes:
  # Control-plane node — manages the cluster
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080  # NodePort defined in k8s/service.yaml
        hostPort: 30080       # Access the app at http://localhost:30080
        protocol: TCP

  # Worker nodes — run the blue and green application pods
  - role: worker
  - role: worker
