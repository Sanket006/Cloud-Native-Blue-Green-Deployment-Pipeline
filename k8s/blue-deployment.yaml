apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-blue
  labels:
    app: demo-app
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
      version: blue
  template:
    metadata:
      labels:
        app: demo-app
        version: blue
    spec:
      containers:
      - name: demo-app
        image: devops-demo/bg-app:blue
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: APP_VERSION
          value: "blue"

        # Resource limits prevent this pod from consuming all node resources
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"

        # Readiness probe: only send traffic once the app responds on /api/info
        readinessProbe:
          httpGet:
            path: /api/info
            port: 3000
          initialDelaySeconds: 3
          periodSeconds: 5

        # Liveness probe: restart the pod if it stops responding
        livenessProbe:
          httpGet:
            path: /api/info
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
