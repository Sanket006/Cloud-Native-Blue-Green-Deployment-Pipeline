name: CI — Build & Lint Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'k8s/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'k8s/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  # 1. Lint Code & Shell Scripts
  lint:
    name: Code Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          cd app
          npm install

      - name: Validate JavaScript Syntax
        run: |
          node --check app/server.js

      - name: Lint Shell Scripts
        uses: ludeeus/action-shellcheck@master
        with:
          severity: error
          scandir: ./scripts

  # 2. Validate Kubernetes Manifests
  k8s-validate:
    name: Kubernetes Manifest Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Kube-Linter
        uses: stackrox/kube-linter-action@v1.0.4
        with:
          directory: k8s
          # Allow it to warn/fail if there are serious security or configuration issues in k8s manifests

  # 3. Verify Docker Container Builds
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Blue)
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          tags: devops-demo/bg-app:blue

      - name: Build Docker Image (Green)
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          tags: devops-demo/bg-app:green

