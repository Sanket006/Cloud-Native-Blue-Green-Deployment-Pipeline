name: CD — Blue-Green Traffic Switch

# Manually triggered via the GitHub Actions UI.
# To use this against a real cluster:
#   1. Add your kubeconfig as a repository secret named: KUBECONFIG
#   2. Uncomment the "Set up Kubeconfig" step below.
#   3. Uncomment the kubectl patch command in the "Switch Traffic" step.

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Environment to route traffic to'
        required: true
        default: 'green'
        type: choice
        options:
          - blue
          - green

jobs:
  switch-traffic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      # Uncomment this step and configure the KUBECONFIG secret in your repo settings.
      # For AWS EKS, you can also use the aws-actions/amazon-eks-credentials action.
      # - name: Set up Kubeconfig
      #   run: |
      #     mkdir -p $HOME/.kube
      #     echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
      #     chmod 600 $HOME/.kube/config

      - name: Switch Traffic (Patch Service Selector)
        env:
          TARGET_ENV: ${{ github.event.inputs.target_env }}
        run: |
          echo "Requested traffic switch to: $TARGET_ENV"
          # Uncomment the line below once kubeconfig is configured:
          # kubectl patch service bg-demo-service \
          #   -p "{\"spec\":{\"selector\":{\"app\":\"demo-app\",\"version\":\"$TARGET_ENV\"}}}"
          echo "--- DRY RUN: kubectl patch is commented out until KUBECONFIG secret is configured ---"
          echo "See README.md → GitHub Actions section for setup instructions."
