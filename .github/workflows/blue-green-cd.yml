name: CD — Blue-Green Traffic Switch

# Manually triggered via the GitHub Actions UI.
#
# HOW TO ACTIVATE against a real cluster:
#   1. Go to your repo → Settings → Secrets and variables → Actions.
#   2. Add a secret named KUBECONFIG containing your kubeconfig file contents.
#      (Run: cat ~/.kube/config | base64  — or use the raw YAML for EKS)
#   3. Uncomment the "Set up Kubeconfig" step below.
#   4. Uncomment the kubectl patch command in the "Switch Traffic" step.
#
# Until activated, this workflow runs in DRY RUN mode and makes no changes.

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Environment to route traffic to'
        required: true
        default: 'green'
        type: choice
        options:
          - blue
          - green

# Limit GITHUB_TOKEN permissions to read-only for security best practices
permissions:
  contents: read

jobs:
  switch-traffic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Pin to a specific kubectl version for reproducible, predictable runs.
      # Update this version intentionally when you want to upgrade.
      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1


      - name: Set up Kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          python3 -c '
          import os, base64
          content = os.environ.get("KUBECONFIG_CONTENT", "").strip()
          # Strip leading/trailing single or double quotes
          if (content.startswith("\"") and content.endswith("\"")) or (content.startswith("\u0027") and content.endswith("\u0027")):
              content = content[1:-1].strip()

          if "apiVersion" in content:
              print("Detected raw Kubeconfig.")
              result = content
          else:
              print("Attempting base64 decode of Kubeconfig...")
              try:
                  decoded = base64.b64decode(content).decode("utf-8").strip()
                  if "apiVersion" in decoded:
                      print("Successfully decoded base64 Kubeconfig.")
                      result = decoded
                  else:
                      raise ValueError("Decoded content does not contain apiVersion")
              except Exception as e:
                  print(f"Decoding failed: {e}. Writing raw content as-is.")
                  result = content

          kube_dir = os.path.expanduser("~/.kube")
          os.makedirs(kube_dir, exist_ok=True)
          with open(os.path.join(kube_dir, "config"), "w", encoding="utf-8") as f:
              f.write(result)
          '
          chmod 600 $HOME/.kube/config



      - name: Switch Traffic (Patch Service Selector)
        env:
          TARGET_ENV: ${{ github.event.inputs.target_env }}
        run: |
          echo "🚀 Actively switching traffic to environment: $TARGET_ENV"
          kubectl patch service bg-demo-service \
            -p "{\"spec\":{\"selector\":{\"app\":\"demo-app\",\"version\":\"$TARGET_ENV\"}}}"
          echo "✅ Traffic routing updated successfully."


